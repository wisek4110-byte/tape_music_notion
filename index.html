<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassette Tape Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nanum+Pen+Script&family=Special+Elite&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#242222;
    --cream:#FBF7EE;
    --wine:#7B2239;
    --wine-2:#95304b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:transparent;
    font-family:"Noto Sans KR","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:6px;
    -webkit-font-smoothing:antialiased;
  }

  /* The whole cassette is drawn on a 975 x 627 sheet (assets/cassette.png).
     --u is one pixel of that sheet, so every number below is a sample pixel. */
  .stage{
    position:relative;
    width:min(100%, 900px, calc((100vh - 12px) * 975 / 627));
  }
  .tape{
    position:relative;
    aspect-ratio:975 / 627;
    container-type:inline-size;
    --u:calc(100cqw / 975);
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .tape img{display:block;-webkit-user-drag:none}
  .bg{position:absolute;left:0;top:0;width:100%;height:100%}
  .yt-host{position:absolute;left:0;bottom:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none;z-index:-1}

  /* ---------- title: sits on the first ruled line (y=121), like handwriting on a J-card ---------- */
  .title-svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .title-svg text{fill:var(--ink)}
  [data-font="hand"] .title-svg text{font-family:"Caveat","Nanum Pen Script",cursive;font-weight:700}
  [data-font="type"] .title-svg text{font-family:"Special Elite","Courier New",monospace;font-weight:400}
  [data-font="sans"] .title-svg text{font-family:"Noto Sans KR",sans-serif;font-weight:700}

  /* ---------- reels ---------- */
  .wheel{
    position:absolute;top:calc(216*var(--u));
    width:calc(121*var(--u));height:auto;
    animation:spin 2.6s linear infinite;animation-play-state:paused;
    will-change:transform;
  }
  .wheel.l{left:calc(221*var(--u))}
  .wheel.r{left:calc(635*var(--u))}
  .playing .wheel{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .wheel{animation-duration:9s} }

  /* ---------- info bar ---------- */
  .ticker{
    position:absolute;left:calc(86*var(--u));top:calc(386*var(--u));
    width:calc(266*var(--u));height:calc(50*var(--u));overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 93%,transparent 100%);
            mask-image:linear-gradient(90deg,#000 0,#000 93%,transparent 100%);
  }
  .ticker-text{
    position:absolute;left:0;top:calc(-1.5*var(--u));white-space:nowrap;color:#fff;
    font-size:calc(26*var(--u));line-height:calc(50*var(--u));
  }
  .ticker-text.scroll{animation:slide var(--dur,9s) ease-in-out infinite alternate}
  @keyframes slide{
    0%,14%{transform:translateX(0)}
    86%,100%{transform:translateX(var(--dx,0px))}
  }
  @media (prefers-reduced-motion: reduce){ .ticker-text.scroll{animation-duration:calc(var(--dur,9s) * 2)} }
  .note{
    position:absolute;left:calc(368*var(--u));top:calc(400.3*var(--u));
    width:calc(13.4*var(--u));height:calc(21*var(--u));
  }
  .brand{
    position:absolute;right:calc(84*var(--u));top:calc(383*var(--u));
    color:#fff;font-weight:700;font-size:calc(22.5*var(--u));line-height:calc(50*var(--u));letter-spacing:.08em;
  }

  /* ---------- controls ---------- */
  .cbtn{
    position:absolute;top:calc(486*var(--u));
    width:calc(113*var(--u));height:calc(113*var(--u));
    border:0;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;
    background:var(--cream);color:var(--ink);
    transition:transform .12s ease, filter .12s ease;
  }
  .cbtn svg{width:36%;height:36%;fill:currentColor}
  .cbtn.main{
    top:calc(485.8*var(--u));width:calc(113.4*var(--u));height:calc(113.4*var(--u));
    background:var(--wine);color:var(--cream);
  }
  .cbtn:hover{filter:brightness(.94)}
  .cbtn.main:hover{filter:brightness(1.18)}
  .cbtn:active{transform:scale(.94)}
  .cbtn:focus-visible,.rep:focus-visible,.gear:focus-visible,.wave:focus-visible{
    outline:calc(3*var(--u)) solid var(--cream);outline-offset:calc(3*var(--u));
  }

  .wave{
    position:absolute;left:calc(470*var(--u));top:calc(476*var(--u));
    width:calc(359*var(--u));height:calc(133*var(--u));
    cursor:pointer;touch-action:none;
  }
  .wave svg{display:block;width:100%;height:100%}

  .rep{
    position:absolute;left:calc(858*var(--u));top:calc(510*var(--u));
    width:calc(80*var(--u));height:calc(74*var(--u));
    border:0;border-radius:calc(14*var(--u));background:transparent;cursor:pointer;
  }
  .rep img{transition:opacity .12s ease}
  .rep:hover img{opacity:.78}
  .rep img{position:absolute;left:calc(6*var(--u));top:calc(7*var(--u));width:calc(50*var(--u));height:auto}
  .rep .badge{
    position:absolute;left:calc(45*var(--u));top:calc(39*var(--u));
    width:calc(31*var(--u));height:calc(31*var(--u));border-radius:50%;
    background:#F2F2F2;color:var(--ink);
    display:none;
  }
  .rep .badge svg{display:block;width:100%;height:100%}
  .rep[data-mode="one"] .badge{display:block}

  /* ---------- settings button: invisible until the pointer is over the tape ---------- */
  .gear{
    position:absolute;z-index:4;
    left:calc(908*var(--u));top:calc(58*var(--u));
    width:max(26px,calc(46*var(--u)));height:max(26px,calc(46*var(--u)));
    transform:translate(-50%,-50%);
    border:0;border-radius:50%;cursor:pointer;
    background:rgba(36,34,34,.85);
    display:grid;place-items:center;
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .gear img{width:58%;height:58%}
  .tape:hover .gear,.tape.reveal .gear,.gear:focus-visible{opacity:1;pointer-events:auto}

  .toast{
    position:absolute;left:50%;top:calc(14*var(--u));transform:translateX(-50%);
    background:var(--wine);color:#fff;font-size:max(11px,calc(19*var(--u)));font-weight:700;
    padding:.45em 1em;border-radius:999px;opacity:0;transition:opacity .2s ease;
    white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
    pointer-events:none;z-index:9;
  }
  .toast.show{opacity:1}

  /* ---------- settings sheet ---------- */
  .sheet{
    position:fixed;inset:0;z-index:6;background:rgba(20,16,19,.98);
    padding:16px;overflow:auto;-webkit-overflow-scrolling:touch;display:none;color:var(--cream);
  }
  .sheet.open{display:block}
  .sheet h2{font-size:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
  .sheet label{display:block;font-size:11px;opacity:.72;margin:8px 0 3px}
  .sheet input[type=text],.sheet select{
    width:100%;padding:7px 9px;border-radius:7px;border:1px solid rgba(239,231,217,.22);
    background:rgba(255,255,255,.06);color:var(--cream);font-size:12px;font-family:inherit;
  }
  .sheet input:focus,.sheet select:focus{outline:2px solid var(--wine-2);outline-offset:0;border-color:transparent}
  .sheet select option{color:#111}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{min-width:0}
  .hint{font-size:10.5px;opacity:.6;margin-top:6px;line-height:1.5}
  .hint b{color:#f0b7c6;font-weight:700}

  .slot{margin-top:7px}
  .slot-line{display:flex;gap:6px;align-items:center}
  .slot-no{flex:0 0 auto;width:20px;text-align:right;font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
  .slot-del{
    flex:0 0 auto;width:26px;height:28px;border-radius:7px;cursor:pointer;
    border:1px solid rgba(239,231,217,.2);background:transparent;color:var(--cream);font-size:12px;
  }
  .slot-del:hover{background:rgba(239,231,217,.12)}
  .slot-kind{font-size:10.5px;opacity:.8;margin:3px 0 0 26px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .swap{
    border:1px solid rgba(239,231,217,.3);background:transparent;color:var(--cream);
    font-size:10px;font-family:inherit;padding:2px 7px;border-radius:999px;cursor:pointer;
  }
  .swap:hover{background:rgba(239,231,217,.12)}
  .add{
    margin-top:9px;width:100%;padding:8px;border-radius:8px;cursor:pointer;
    border:1px dashed rgba(239,231,217,.3);background:transparent;color:var(--cream);
    font-size:11.5px;font-family:inherit;
  }
  .add:hover{background:rgba(239,231,217,.08)}
  .add:disabled{opacity:.4;cursor:not-allowed}

  .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .acts button{flex:1 1 auto;padding:9px 12px;border-radius:8px;border:0;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit}
  .primary{background:var(--wine);color:#fff}
  .ghost{background:rgba(239,231,217,.12);color:var(--cream)}
  .close{background:transparent;border:0;color:var(--cream);font-size:16px;cursor:pointer;line-height:1;padding:2px 4px}
  .linkout{
    width:100%;margin-top:10px;padding:7px 9px;border-radius:7px;
    border:1px solid rgba(239,231,217,.22);background:rgba(255,255,255,.06);
    color:var(--cream);font-size:10.5px;font-family:ui-monospace,monospace;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="tape" id="tape" data-font="hand">
    <img class="bg" src="assets/cassette.png" alt="" draggable="false">

    <svg class="title-svg" viewBox="0 0 975 627" aria-hidden="true">
      <text id="title" x="486.5" y="119.5" text-anchor="middle" font-size="100">Love Songs</text>
    </svg>

    <img class="wheel l" src="assets/wheel.png" alt="" draggable="false">
    <img class="wheel r" src="assets/wheel.png" alt="" draggable="false">

    <div class="ticker"><span class="ticker-text" id="sub">pon play para empezar</span></div>
    <svg class="note" viewBox="0 0 14 22" aria-hidden="true"><g fill="#fff"><rect x="6" y="0.6" width="1.7" height="17.4"/><ellipse cx="3.3" cy="19.3" rx="3.5" ry="1.95" transform="rotate(-28 3.3 19.3)"/><path d="M7.7 .7C9.4 1.9 11.6 3.3 13.3 6.6C13.9 8.6 13.5 11.4 11.6 16.3C11.9 13.8 12.1 10.8 11.2 8.9C10.2 6.8 9 5 7.7 3.9Z"/></g></svg>
    <span class="brand">AUDIO TAPE</span>

    <button class="cbtn" id="prev" type="button" style="left:calc(25*var(--u))" aria-label="이전 곡">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.5v14H6zm12.5 0v14L8.9 12z"/></svg>
    </button>
    <button class="cbtn main" id="play" type="button" style="left:calc(173.3*var(--u))" aria-label="재생" aria-pressed="false">
      <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 19.5 12 7 19.5z"/></svg>
    </button>
    <button class="cbtn" id="next" type="button" style="left:calc(322*var(--u))" aria-label="다음 곡">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5H18v14h-2.5zM5.5 5l9.6 7-9.6 7z"/></svg>
    </button>

    <div class="wave" id="bar" role="slider" tabindex="0" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg viewBox="470 476 359 133" aria-hidden="true">
        <defs>
          <linearGradient id="wg" gradientUnits="userSpaceOnUse" x1="470" y1="0" x2="829" y2="0">
            <stop id="wgA" offset="0" stop-color="#FBF7EE"/>
            <stop id="wgB" offset="0" stop-color="#A8A49F"/>
          </linearGradient>
        </defs>
        <g id="waveBars" fill="url(#wg)"></g>
      </svg>
    </div>

    <button class="rep" id="rep" type="button" data-mode="all" aria-label="반복 모드: 전체 반복">
      <img src="assets/repeat.png" alt="" draggable="false">
      <span class="badge" aria-hidden="true"><svg viewBox="0 0 31 31"><g fill="#242222"><rect x="15.55" y="7.5" width="1.65" height="15.5"/><path d="M16.86 8.66L16.14 7.34L11.34 9.94L12.06 11.26Z"/></g></svg></span>
    </button>

    <button class="gear" id="gear" type="button" aria-label="위젯 설정 열기" title="설정">
      <img src="assets/settings.png" alt="" draggable="false">
    </button>

    <div class="toast" id="toast"></div>
  </div>
  <div class="yt-host"><div id="yt"></div></div>
</div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="위젯 설정">
    <h2>카세트 설정 <button class="close" id="closeSheet" type="button" aria-label="닫기">✕</button></h2>

    <label for="fTitle">테이프 제목 (최대 20자)</label>
    <input id="fTitle" type="text" maxlength="20" placeholder="Love Songs">

    <label for="fSub">재생 전 문구 (재생 중에는 곡 제목이 흐릅니다)</label>
    <input id="fSub" type="text" maxlength="60" placeholder="pon play para empezar">

    <div class="row" style="margin-top:8px">
      <div style="flex:1">
        <label for="fFont">글씨체</label>
        <select id="fFont">
          <option value="hand">손글씨 (필기체)</option>
          <option value="type">타자기</option>
          <option value="sans">고딕</option>
        </select>
      </div>
      <div style="flex:1">
        <label for="fRep">기본 반복</label>
        <select id="fRep">
          <option value="all">전체 반복</option>
          <option value="one">한 곡 반복</option>
        </select>
      </div>
    </div>

    <label>음악 목록 — 유튜브 영상 또는 재생목록 주소 <span id="slotCount" style="opacity:.8"></span></label>
    <div id="slots"></div>
    <button class="add" id="addSlot" type="button">+ 칸 추가 (최대 20개)</button>

    <div class="hint">재생목록 주소를 넣으면 그 목록 전체가 한 칸에 들어갑니다. <b>Notion</b>에는 아래 “임베드 주소”를 복사해 <b>/임베드</b> 블록에 붙여넣으세요.</div>

    <div class="acts">
      <button class="primary" id="apply" type="button">적용</button>
      <button class="ghost" id="copy" type="button">임베드 주소 복사</button>
    </div>
    <input class="linkout" id="linkout" type="text" readonly aria-label="임베드 주소">
  </div>
<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var tape=$('tape'), titleEl=$('title'), subEl=$('sub'),
      playBtn=$('play'), playIcon=$('playIcon'), repBtn=$('rep'),
      bar=$('bar'), wgA=$('wgA'), wgB=$('wgB'), gear=$('gear'),
      toastEl=$('toast'), sheet=$('sheet');

  var MAX_TRACKS=20;
  var ICON_PLAY='M7 4.5 19.5 12 7 19.5z';
  var ICON_PAUSE='M7 5h3.6v14H7zm6.4 0H17v14h-3.6z';

  var DEFAULTS={
    title:'Love Songs',
    sub:'pon play para empezar',
    font:'hand',
    repeat:'all',
    tracks:[]
  };
  var S=Object.assign({},DEFAULTS);

  /* ---------------- waveform ---------------- */
  /* Bar heights as a percent of the full height (113px of the 975x627 sheet, the same as the round
     buttons). Edit this list to reshape the waveform: any length works, bars are spread evenly. */
  var WAVE=[76,42,66,73,87,63,40,33,49,80,77,38,60,38,92,65,87,99,89,83,65,53,81,59,34,99,100,75,44,54];
  (function drawWave(){
    var X0=470, X1=829, BW=4.2, H=113, CY=542.5, NS='http://www.w3.org/2000/svg',
        g=$('waveBars'), pitch=(X1-X0-BW)/(WAVE.length-1);
    WAVE.forEach(function(v,i){
      var h=H*v/100, r=document.createElementNS(NS,'rect');
      r.setAttribute('x',(X0+i*pitch).toFixed(2));
      r.setAttribute('y',(CY-h/2).toFixed(2));
      r.setAttribute('width',BW);
      r.setAttribute('height',h.toFixed(2));
      r.setAttribute('rx',BW/2);
      g.appendChild(r);
    });
  })();


  /* ---------------- youtube url parsing ---------------- */
  var VID=/^[A-Za-z0-9_-]{11}$/;
  var LIST=/^[A-Za-z0-9_-]{12,}$/;

  function parseYT(raw){
    var s=(raw||'').trim();
    if(!s) return null;
    if(VID.test(s)) return {kind:'v',id:s};
    if(/^(PL|OL|UU|LL|FL|RD)/.test(s) && LIST.test(s)) return {kind:'p',id:s};
    var url;
    try{ url=new URL(/^https?:\/\//i.test(s)?s:'https://'+s); }catch(e){ return null; }
    if(!/(^|\.)youtube\.com$|(^|\.)youtube-nocookie\.com$|(^|\.)youtu\.be$/i.test(url.hostname)) return null;
    var list=url.searchParams.get('list');
    var v=url.searchParams.get('v');
    if(!v){
      var m=url.pathname.match(/\/(?:embed|shorts|v|live)\/([A-Za-z0-9_-]{11})/);
      if(m) v=m[1];
      else if(/youtu\.be$/i.test(url.hostname)){
        var seg=url.pathname.replace(/^\//,'').split('/')[0];
        if(VID.test(seg)) v=seg;
      }
    }
    var usable=(list && list!=='WL' && list!=='LL') ? list : null;
    if(usable && v) return {kind:'p',id:usable,alt:{kind:'v',id:v}};
    if(usable) return {kind:'p',id:usable};
    if(v) return {kind:'v',id:v};
    return null;
  }

  /* ---------------- config <-> url ---------------- */
  function readConfig(){
    var q=new URLSearchParams(location.search);
    if(!q.toString() && location.hash.length>1) q=new URLSearchParams(location.hash.slice(1));
    var cfg;
    if(q.toString().length){
      cfg={
        title:q.get('t')||DEFAULTS.title,
        sub:q.get('s')!==null?q.get('s'):DEFAULTS.sub,
        font:['hand','type','sans'].indexOf(q.get('f'))>=0?q.get('f'):DEFAULTS.font,
        repeat:q.get('r')==='one'?'one':'all',
        tracks:[]
      };
      var raws=[];
      if(q.get('a')) raws=q.get('a').split(',');
      else for(var i=1;i<=MAX_TRACKS;i++){ var one=q.get('a'+i); if(one) raws.push(one); }
      raws.forEach(function(raw){
        raw=(raw||'').trim(); if(!raw) return;
        var m=/^([vp]):(.+)$/.exec(raw);
        var t=m?{kind:m[1],id:m[2]}:parseYT(raw);
        if(t) cfg.tracks.push({kind:t.kind,id:t.id});
      });
    }else{
      cfg=null;
      try{ var saved=localStorage.getItem('cassette.cfg'); if(saved) cfg=JSON.parse(saved); }catch(e){}
      if(!cfg) cfg=Object.assign({},DEFAULTS);
    }
    if(!Array.isArray(cfg.tracks)) cfg.tracks=[];
    cfg.tracks=cfg.tracks.slice(0,MAX_TRACKS);
    return cfg;
  }

  function toParams(cfg){
    var q=new URLSearchParams();
    q.set('t',cfg.title);
    q.set('s',cfg.sub);
    q.set('f',cfg.font);
    q.set('r',cfg.repeat);
    if(cfg.tracks.length) q.set('a',cfg.tracks.map(function(t){ return t.kind+':'+t.id; }).join(','));
    return q.toString();
  }
  function embedURL(cfg){ return location.origin+location.pathname+'?'+toParams(cfg); }

  /* ---------------- title auto-fit ---------------- */
  /* The title is SVG text on the label's ruled lines (975x627 sheet coordinates),
     so it scales with the cassette; only the font size needs fitting. */
  var TITLE_SIZE={hand:100,type:76,sans:74};   /* starting size per face */
  var TITLE_MAXW=796;                          /* the ruled lines are 808 wide */
  function fitTitle(){
    var fs=TITLE_SIZE[S.font]||TITLE_SIZE.hand, w, i;
    titleEl.setAttribute('font-size',fs);
    for(i=0;i<5;i++){
      w=titleEl.getComputedTextLength?titleEl.getComputedTextLength():0;
      if(!(w>TITLE_MAXW)) break;
      fs=Math.max(14,fs*TITLE_MAXW/w*0.995);
      titleEl.setAttribute('font-size',fs.toFixed(2));
    }
  }

  /* ---------------- marquee ticker ---------------- */
  var tickerText='';
  function setTicker(text){
    if(text===tickerText) return;
    tickerText=text;
    subEl.classList.remove('scroll');
    subEl.textContent=text;
    requestAnimationFrame(function(){
      var over=subEl.scrollWidth-subEl.parentNode.clientWidth;
      if(over>2){
        subEl.style.setProperty('--dx',(-over-2)+'px');
        subEl.style.setProperty('--dur',Math.max(5,(over+2)/26+3).toFixed(1)+'s');
        subEl.classList.add('scroll');
      }else{
        subEl.style.removeProperty('--dx');
      }
    });
  }
  function refitTicker(){ var t=tickerText; tickerText=''; setTicker(t); }
  if(window.ResizeObserver) new ResizeObserver(refitTicker).observe(subEl.parentNode);
  window.addEventListener('resize',function(){ fitTitle(); refitTicker(); });
  if(document.fonts){
    if(document.fonts.ready) document.fonts.ready.then(function(){ fitTitle(); refitTicker(); }).catch(function(){});
    if(document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',function(){ fitTitle(); refitTicker(); });
  }

  /* ---------------- render ---------------- */
  function applyConfig(cfg,opts){
    S=cfg;
    tape.setAttribute('data-font',S.font);
    titleEl.textContent=S.title||'';
    fitTitle();
    setRepeat(S.repeat,true);
    renderIdle();
    if(!opts||!opts.skipPlayer) resetPlayback();
  }

  function renderIdle(){
    if(!playing){
      setTicker(S.tracks.length ? (S.sub||'') : '⚙ 설정에서 유튜브 주소를 넣어주세요');
    }
  }

  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t=setTimeout(function(){ toastEl.classList.remove('show'); },1600);
  }
  function fmt(sec){
    if(!isFinite(sec)||sec<0) sec=0;
    var m=Math.floor(sec/60), s=Math.floor(sec%60);
    return m+':'+(s<10?'0':'')+s;
  }

  /* ---------------- player ---------------- */
  var player=null, ready=false, cur=0, playing=false, wantPlay=false, scrubbing=false;

  window.onYouTubeIframeAPIReady=function(){
    player=new YT.Player('yt',{
      height:'2', width:'2',
      playerVars:{playsinline:1,controls:0,rel:0,modestbranding:1,iv_load_policy:3,disablekb:1},
      events:{
        onReady:function(){ ready=true; cueTrack(cur,wantPlay); wantPlay=false; },
        onStateChange:onState,
        onError:onError
      }
    });
  };
  function loadAPI(){
    if(window.YT&&window.YT.Player){ window.onYouTubeIframeAPIReady(); return; }
    var s=document.createElement('script');
    s.src='https://www.youtube.com/iframe_api';
    s.async=true;
    s.onerror=function(){ toast('유튜브를 불러오지 못했습니다'); };
    document.head.appendChild(s);
  }

  function curTrack(){ return S.tracks[cur]||null; }

  function cueTrack(i,autoplay){
    if(!ready||!S.tracks.length) return;
    cur=((i%S.tracks.length)+S.tracks.length)%S.tracks.length;
    var t=S.tracks[cur];
    if(t.kind==='p'){
      if(autoplay) player.loadPlaylist({list:t.id,listType:'playlist',index:0});
      else player.cuePlaylist({list:t.id,listType:'playlist',index:0});
    }else{
      if(player.getPlaylist&&player.getPlaylist()){ try{ player.stopVideo(); }catch(e){} }
      if(autoplay) player.loadVideoById(t.id);
      else player.cueVideoById(t.id);
    }
    setProgress(0,0);
  }

  function resetPlayback(){
    cur=0; playing=false; setPlayIcon(false);
    tape.classList.remove('playing');
    setProgress(0,0);
    renderIdle();
    if(ready) cueTrack(0,false);
  }

  function inPlaylist(){
    var t=curTrack();
    if(!t||t.kind!=='p'||!player||!player.getPlaylist) return false;
    var pl=player.getPlaylist();
    return !!(pl&&pl.length);
  }

  function toggle(){
    if(!S.tracks.length){ openSheet(); return; }
    if(!ready){ wantPlay=!wantPlay; toast('불러오는 중…'); return; }
    if(playing){ player.pauseVideo(); return; }
    var data=player.getVideoData?player.getVideoData():null;
    if(!data||!data.video_id) cueTrack(cur,true);
    else player.playVideo();
  }
  function next(){
    if(!S.tracks.length||!ready) return;
    if(inPlaylist()){
      var idx=player.getPlaylistIndex(), len=player.getPlaylist().length;
      if(idx<len-1){ player.nextVideo(); return; }
    }
    cueTrack(cur+1,true);
  }
  function prev(){
    if(!S.tracks.length||!ready) return;
    if(player.getCurrentTime&&player.getCurrentTime()>3){ player.seekTo(0,true); return; }
    if(inPlaylist()&&player.getPlaylistIndex()>0){ player.previousVideo(); return; }
    cueTrack(cur-1,true);
  }

  function onState(e){
    var st=e.data;
    playing=(st===YT.PlayerState.PLAYING);
    tape.classList.toggle('playing',playing);
    setPlayIcon(playing);
    if(st===YT.PlayerState.PLAYING||st===YT.PlayerState.PAUSED){
      var d=player.getVideoData?player.getVideoData():null;
      if(d&&d.title) setTicker(d.title);
    }
    if(st===YT.PlayerState.ENDED){
      if(S.repeat==='one'){ player.seekTo(0,true); player.playVideo(); }
      else next();
    }
    if(st===YT.PlayerState.CUED||st===YT.PlayerState.UNSTARTED) renderIdle();
  }
  function onError(){
    toast('이 영상은 재생할 수 없어요');
    if(S.tracks.length>1) setTimeout(function(){ cueTrack(cur+1,true); },900);
  }

  function setPlayIcon(p){
    playIcon.innerHTML='<path d="'+(p?ICON_PAUSE:ICON_PLAY)+'"/>';
    playBtn.setAttribute('aria-label',p?'일시정지':'재생');
    playBtn.setAttribute('aria-pressed',p?'true':'false');
  }
  setPlayIcon(false);

  function setProgress(ratio,dur,now){
    var r=Math.max(0,Math.min(1,ratio||0));
    wgA.setAttribute('offset',r);          /* bars left of the offset are cream, the rest gray */
    wgB.setAttribute('offset',r);
    bar.setAttribute('aria-valuenow',Math.round(r*100));
    if(dur>0) bar.setAttribute('aria-valuetext',fmt(now||0)+' / '+fmt(dur));
  }

  setInterval(function(){
    if(!ready||!player.getDuration||scrubbing||!playing) return;
    var d=player.getDuration(), t=player.getCurrentTime();
    if(d>0) setProgress(t/d,d,t);
  },250);

  function seekFromEvent(ev){
    var rect=bar.getBoundingClientRect();
    var ratio=Math.max(0,Math.min(1,(ev.clientX-rect.left)/rect.width));
    var d=(ready&&player.getDuration)?player.getDuration():0;
    setProgress(ratio,d,ratio*d);
    return ratio;
  }
  bar.addEventListener('pointerdown',function(ev){
    if(!ready||!player.getDuration||!player.getDuration()) return;
    scrubbing=true; bar.setPointerCapture(ev.pointerId); seekFromEvent(ev);
  });
  bar.addEventListener('pointermove',function(ev){ if(scrubbing) seekFromEvent(ev); });
  bar.addEventListener('pointerup',function(ev){
    if(!scrubbing) return;
    var r=seekFromEvent(ev);
    scrubbing=false;
    player.seekTo(r*player.getDuration(),true);
  });
  bar.addEventListener('keydown',function(ev){
    if(!ready||!player.getDuration||!player.getDuration()) return;
    var d=player.getDuration(), t=player.getCurrentTime();
    if(ev.key==='ArrowRight'){ player.seekTo(Math.min(d,t+5),true); ev.preventDefault(); }
    if(ev.key==='ArrowLeft'){ player.seekTo(Math.max(0,t-5),true); ev.preventDefault(); }
  });

  function setRepeat(mode,silent){
    S.repeat=(mode==='one')?'one':'all';
    repBtn.setAttribute('data-mode',S.repeat);
    repBtn.setAttribute('aria-label','반복 모드: '+(S.repeat==='one'?'한 곡 반복':'전체 반복'));
    if(ready&&player.setLoop){ try{ player.setLoop(S.repeat!=='one'); }catch(e){} }
    if(!silent) toast(S.repeat==='one'?'한 곡 반복':'전체 반복');
  }

  playBtn.addEventListener('click',toggle);
  $('next').addEventListener('click',next);
  $('prev').addEventListener('click',prev);
  repBtn.addEventListener('click',function(){ setRepeat(S.repeat==='one'?'all':'one'); });
  document.addEventListener('keydown',function(ev){
    if(sheet.classList.contains('open')) return;
    var tag=(ev.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='select'||tag==='button') return;   /* buttons handle Space themselves */
    if(ev.code==='Space'){ ev.preventDefault(); toggle(); }
  });

  /* ---------------- settings sheet ---------------- */
  var slotsBox=$('slots'), addBtn=$('addSlot'), countEl=$('slotCount');

  function slotInputs(){ return slotsBox.querySelectorAll('input'); }

  function describe(inp,el){
    var raw=inp.value;
    el.innerHTML='';
    if(!raw.trim()){ el.style.color=''; return; }
    var t=parseYT(raw);
    if(!t){ el.textContent='⚠ 유튜브 주소를 인식하지 못했어요'; el.style.color='#f0b7c6'; return; }
    el.style.color='';
    el.appendChild(document.createTextNode(t.kind==='p'?'▸ 재생목록 ('+t.id+')':'▸ 영상 ('+t.id+')'));
    if(t.alt){
      var b=document.createElement('button');
      b.type='button'; b.className='swap'; b.textContent='이 영상 한 곡만';
      b.addEventListener('click',function(){
        inp.value='https://www.youtube.com/watch?v='+t.alt.id;
        describe(inp,el);
      });
      el.appendChild(b);
    }
  }

  function renumber(){
    var rows=slotsBox.children;
    for(var i=0;i<rows.length;i++) rows[i].querySelector('.slot-no').textContent=(i+1);
    countEl.textContent='('+rows.length+'/'+MAX_TRACKS+')';
    addBtn.disabled=rows.length>=MAX_TRACKS;
  }

  function addSlot(value,focus){
    if(slotsBox.children.length>=MAX_TRACKS) return null;
    var row=document.createElement('div');
    row.className='slot';
    row.innerHTML='<div class="slot-line"><span class="slot-no"></span>'+
      '<input type="text" placeholder="https://www.youtube.com/watch?v=… / playlist?list=…">'+
      '<button class="slot-del" type="button" aria-label="이 칸 삭제">✕</button></div>'+
      '<div class="slot-kind"></div>';
    var inp=row.querySelector('input'), kind=row.querySelector('.slot-kind');
    inp.value=value||'';
    inp.addEventListener('input',function(){ describe(inp,kind); });
    row.querySelector('.slot-del').addEventListener('click',function(){
      row.remove();
      if(!slotsBox.children.length) addSlot('');
      renumber();
    });
    slotsBox.appendChild(row);
    describe(inp,kind);
    renumber();
    if(focus) inp.focus();
    return inp;
  }
  addBtn.addEventListener('click',function(){ addSlot('',true); });

  function openSheet(){
    $('fTitle').value=S.title;
    $('fSub').value=S.sub;
    $('fFont').value=S.font;
    $('fRep').value=S.repeat;
    slotsBox.innerHTML='';
    if(S.tracks.length){
      S.tracks.forEach(function(t){
        addSlot(t.kind==='p'?'https://www.youtube.com/playlist?list='+t.id
                            :'https://www.youtube.com/watch?v='+t.id);
      });
    }else{
      addSlot(''); addSlot('');
    }
    $('linkout').value=embedURL(S);
    sheet.classList.add('open');
    $('fTitle').focus();
  }
  function closeSheet(){ sheet.classList.remove('open'); }

  function collect(){
    var cfg={
      title:($('fTitle').value||'').slice(0,20)||DEFAULTS.title,
      sub:$('fSub').value,
      font:$('fFont').value,
      repeat:$('fRep').value,
      tracks:[]
    };
    Array.prototype.forEach.call(slotInputs(),function(inp){
      var t=parseYT(inp.value);
      if(t&&cfg.tracks.length<MAX_TRACKS) cfg.tracks.push({kind:t.kind,id:t.id});
    });
    return cfg;
  }

  gear.addEventListener('click',openSheet);

  /* touch screens have no hover: a tap on the tape shows the gear for a few seconds */
  var revealTimer;
  tape.addEventListener('pointerdown',function(ev){
    if(ev.pointerType!=='touch') return;
    tape.classList.add('reveal');
    clearTimeout(revealTimer);
    revealTimer=setTimeout(function(){ tape.classList.remove('reveal'); },3500);
  });
  $('closeSheet').addEventListener('click',closeSheet);
  document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') closeSheet(); });

  $('apply').addEventListener('click',function(){
    var cfg=collect();
    try{ localStorage.setItem('cassette.cfg',JSON.stringify(cfg)); }catch(e){}
    history.replaceState(null,'','?'+toParams(cfg));
    $('linkout').value=embedURL(cfg);
    applyConfig(cfg);
    closeSheet();
    toast(cfg.tracks.length?('적용되었습니다 · '+cfg.tracks.length+'곡'):'적용되었습니다');
  });

  $('copy').addEventListener('click',function(){
    var url=embedURL(collect());
    var out=$('linkout');
    out.value=url; out.focus(); out.select();
    var done=function(){ toast('임베드 주소를 복사했습니다'); };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done,function(){
        try{ document.execCommand('copy'); done(); }catch(e){ toast('주소를 직접 복사해 주세요'); }
      });
    }else{
      try{ document.execCommand('copy'); done(); }catch(e){ toast('주소를 직접 복사해 주세요'); }
    }
  });

  /* ---------------- boot ---------------- */
  applyConfig(readConfig(),{skipPlayer:true});
  loadAPI();
  window.addEventListener('load',function(){
    var broken=Array.prototype.some.call(tape.querySelectorAll('img'),function(img){ return !img.naturalWidth; });
    if(broken) toast('이미지를 불러오지 못했어요 (assets 폴더 확인)');
  });
})();
</script>
</body>
</html>
